services:
  # ============================================================================
  # 1. PostgreSQL Database Service
  # ============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: fanspace-postgres
    restart: always
    environment:
      POSTGRES_USER: fanspace
      POSTGRES_PASSWORD: fanspace_password
      POSTGRES_DB: fanspace_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fanspace -d fanspace_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - fanspace-network

  # ============================================================================
  # 2. Redis In-Memory Cache & Pub/Sub Service
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: fanspace-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - fanspace-network

  # ============================================================================
  # 3. FanSpace Backend API Service (FastAPI + Socket.IO)
  # ============================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fanspace-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=postgresql+asyncpg://fanspace:fanspace_password@postgres:5432/fanspace_db
      - REDIS_URL=redis://redis:6379/0
      - PORT=8000
      - ENVIRONMENT=development
      - DEBUG=true
      - SECRET_KEY=fanspace-super-secret-scientific-benchmark-key-change-in-prod
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=30
      - REFRESH_TOKEN_EXPIRE_DAYS=7
      - GOOGLE_CLIENT_ID=282351853301-svrittqkk76n3biil9l93l0a6fvj9nja.apps.googleusercontent.com
      - GOOGLE_CLIENT_SECRET=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
      - GOOGLE_REDIRECT_URI=http://localhost:8000/api/v1/auth/google/callback
      - SMTP_USER=lamgiaoda@gmail.com
      - SMTP_PASSWORD=usgqvdowsashpunc
      - EMAILS_FROM_EMAIL=lamgiaoda@gmail.com
      - DEBUG_OTP_IN_RESPONSE=true
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - fanspace-network

  # ============================================================================
  # 4. FanSpace Frontend Web Service (Flutter Web + Nginx)
  # ============================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: fanspace-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1/healthz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - fanspace-network

volumes:
  postgres_data:
  redis_data:

networks:
  fanspace-network:
    driver: bridge
